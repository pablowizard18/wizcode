<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizCode Lab Definitivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; padding-top: 50px; font-family: system-ui, sans-serif; }
        .chat-box { height: 400px; overflow-y: auto; background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #3b82f6; }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 8px; }
        .user-msg { background: #2563eb; color: white; margin-left: auto; width: fit-content; text-align: right; }
        .bot-msg { background: #334155; color: #f1f5f9; margin-right: auto; width: fit-content; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center mb-4">
            <h1 class="fw-bold">Wiz<span class="text-primary">Code</span> AI Lab</h1>
            <p class="text-muted">El WizBot corriendo en vivo y con personalidad</p>
        </div>
        <div class="col-md-8">
            <div class="chat-box mb-3" id="chat">
                <div class="msg bot-msg">✨ <b>WizBot:</b> ¡Hola Pablo! Conexión con Gemini 2.5 establecida. Escribime lo que quieras.</div>
            </div>
            <div class="input-group input-group-lg">
                <input type="text" id="userText" class="form-control" placeholder="Escribile como si fueras un cliente...">
                <button class="btn btn-primary" onclick="hablarConMago()">Lanzar Hechizo ✨</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Tu clave limpia de 39 caracteres copiada digitalmente
    const MI_LLAVE = 'AIzaSyCFNA-YX3Jh9-vV8rk1IW4xSAlhOMt_-_Q'; 
    
    // URL Actualizada al modelo estable y vigente para evitar el error 404
    const URL_API = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${MI_LLAVE}`;

    // La personalidad corporativa del WizBot
    const PERSONALIDAD = "Sos el WizBot, el asistente inteligente de la empresa WizCode. Tu misión es atender y conseguir los datos de contacto de potenciales clientes para Pablo (el dueño). Sos profesional, servicial y mágico. Reglas estrictas: 1. Si mencionan WordPress, Elementor o Bootstrap, di que son especialidades de la casa. 2. No des precios exactos. Di que cada proyecto es una pieza única de magia digital y que para un presupuesto exacto deben hablar con Pablo directamente. 3. Tu meta final siempre es pedirles su WhatsApp o Email para que Pablo los contacte. Responde siempre de forma muy concisa y directa.";

    async function hablarConMago() {
        const input = document.getElementById('userText');
        const chat = document.getElementById('chat');
        const texto = input.value.trim();
        if(!texto) return;

        // 1. Pintamos tu mensaje en pantalla
        chat.innerHTML += `<div class="msg user-msg"><b>Vos:</b> ${texto}</div>`;
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        // 2. Mensaje de espera temporal
        const loadingId = 'loading-' + Date.now();
        chat.innerHTML += `<div class="msg bot-msg" id="${loadingId}">✨ <b>WizBot:</b> Lanzando magia...</div>`;
        chat.scrollTop = chat.scrollHeight;

        try {
            // Envío de datos estándar compatible globalmente
            const payload = {
                contents: [{
                    parts: [{ text: `${PERSONALIDAD}\n\nMensaje del cliente actual: ${texto}` }]
                }]
            };

            const respuesta = await fetch(URL_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await respuesta.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            // Lectura limpia del retorno de Google
            if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                let textoBot = data.candidates[0].content.parts[0].text;
                
                // Formateo clásico de negritas y saltos para HTML
                textoBot = textoBot.split('**').join('<b>').split('\n').join('<br>');

                document.getElementById(loadingId).innerHTML = `✨ <b>WizBot:</b> ${textoBot}`;
            } else {
                document.getElementById(loadingId).innerHTML = `✨ <b>WizBot:</b> ¡Hola! Decime, ¿en qué tipo de desarrollo web estás pensando para tu negocio?`;
            }

        } catch (error) {
            console.error("Error en el laboratorio:", error);
            document.getElementById(loadingId).innerHTML = `<span class="text-danger">❌ Error: ${error.message}</span>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }

    // Permitir enviar el mensaje presionando la tecla Enter
    document.getElementById('userText').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') hablarConMago();
    });
</script>

</body>
</html>
